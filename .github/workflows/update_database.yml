name: Monthly Database Update

on:
  schedule:
    # Runs on the 2nd day of every month at 03:00 UTC
    - cron: '0 3 2 * *'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v2026.10)'
        required: false
        default: ''

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build IPAtlas Release Binary
        run: cargo build --release

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "TAG=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v$(date +'%Y.%m')" >> $GITHUB_OUTPUT
          fi

      - name: Download Upstream LITE Datasets
        env:
          TOKEN: ${{ secrets.IP2LOCATION_DOWNLOAD_TOKEN }}
        run: |
          mkdir -p raw_data dist
          echo "Downloading IP2Location LITE DB5..."
          curl -sSL "https://www.ip2location.com/download?token=${TOKEN}&file=DB5LITECSV" -o raw_data/db5.zip
          unzip -q -o raw_data/db5.zip -d raw_data/
          
          echo "Downloading IP2Proxy LITE PX10..."
          curl -sSL "https://www.ip2location.com/download?token=${TOKEN}&file=PX10LITECSV" -o raw_data/px10.zip
          unzip -q -o raw_data/px10.zip -d raw_data/

      - name: Compile IPAtlas Databases
        run: |
          DB5_FILE=$(find raw_data -type f -iname "*db5*.csv" | head -n 1)
          PX10_FILE=$(find raw_data -type f -iname "*px10*.csv" | head -n 1)
          
          echo "Found DB5:  $DB5_FILE"
          echo "Found PX10: $PX10_FILE"
          
          if [ -z "$DB5_FILE" ] || [ -z "$PX10_FILE" ]; then
            echo "Error: Datasets not found in raw_data!"
            ls -la raw_data/
            exit 1
          fi
          
          echo "1. Compiling Unified Full Database (V5 Profile Normalization)..."
          ./target/release/ipatlas compile --mode full --geo "$DB5_FILE" --proxy "$PX10_FILE" --out dist/ipatlas_full.bin
          
          echo "2. Compiling Proxy-Only Database..."
          ./target/release/ipatlas compile --mode proxy --proxy "$PX10_FILE" --out dist/ipatlas_proxy.bin
          
          echo "3. Compiling Geo-Only Database..."
          ./target/release/ipatlas compile --mode geo --geo "$DB5_FILE" --out dist/ipatlas_geo.bin

      - name: Compress Distribution Binaries (Gzip & Zstandard)
        run: |
          sudo apt-get update && sudo apt-get install -y zstd pigz
          cd dist
          for f in *.bin; do
            echo "Compressing $f with gzip..."
            pigz -k -9 "$f"
            echo "Compressing $f with zstd..."
            zstd -19 --keep "$f"
          done
          ls -lh

      - name: Generate SHA256 Checksums
        run: |
          cd dist
          sha256sum *.bin *.bin.gz *.bin.zst > checksums.txt
          cat checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.TAG }}
          name: "IPAtlas GeoIP & Threat Database ${{ steps.vars.outputs.TAG }}"
          body: |
            ## Automated Monthly IPAtlas Database Release (${{ steps.vars.outputs.TAG }})
            
            Compiled binary assets for high-performance zero-copy GeoIP and Proxy/VPN threat intelligence.
            
            ### Included Artifacts
            - `ipatlas_full.bin.zst` (~27 MB) / `.bin.gz` (~35 MB) — **Unified Full**: Country, Region, City, Lat/Lon + Proxy, Datacenter, Botnet, ASN, ISP (V4 Profile Normalization).
            - `ipatlas_proxy.bin.zst` (~9 MB) / `.bin.gz` (~12 MB) — **Proxy-Only**: DCH, VPN, Botnet, Spam, Scanner, ASN, ISP.
            - `ipatlas_geo.bin.zst` (~14 MB) / `.bin.gz` (~19 MB) — **Geo-Only**: Country, Region, City, Lat/Lon.
            
            ### Attribution
            This release contains data from IP2Location LITE (https://lite.ip2location.com).
          files: |
            dist/*.bin
            dist/*.bin.gz
            dist/*.bin.zst
            dist/checksums.txt
