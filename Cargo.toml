[package]
name = "ipatlas"
version = "0.4.1"
edition = "2021"
authors = ["ulquiorracode"]
description = "Ultra-fast zero-copy binary GeoIP and Proxy/VPN threat database compiler and reader in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ulquiorracode/ipatlas"
keywords = ["geoip", "proxy", "vpn", "zero-copy", "threat-intelligence"]
categories = ["network-programming", "data-structures"]

[dependencies]
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
memchr = "2.7"
thiserror = "2.0"
csv = { version = "1.3", optional = true }
rayon = { version = "1.10", optional = true }
zstd = { version = "0.13", optional = true }
flate2 = { version = "1.0", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.17"

[features]
default = ["compiler", "cli"]
compiler = ["dep:csv", "dep:rayon", "dep:zstd", "dep:flate2", "dep:anyhow"]
cli = ["compiler", "dep:clap"]

[[bin]]
name = "ipatlas"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "lookup_bench"
harness = false
