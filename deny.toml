[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
    "RUSTSEC-2026-0258", # h2 unbounded empty DATA frames (transitive in actix-web 4.x / actix-http 3.x)
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "CC0-1.0",
    "Zlib",
    "BSL-1.0",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = ["https://github.com/ulquiorracode/stitch-rs.git"]
