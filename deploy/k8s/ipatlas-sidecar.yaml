apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipatlas-sidecar
  labels:
    app: ipatlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipatlas
  template:
    metadata:
      labels:
        app: ipatlas
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: ipatlas
          image: ipatlas:latest
          args: ["-d", "/data/ipatlas.bin", "-p", "8080", "-b", "0.0.0.0"]
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1000m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          volumeMounts:
            - name: geoip-data
              mountPath: /data
              readOnly: true
      volumes:
        - name: geoip-data
          configMap:
            name: ipatlas-database-config
---
apiVersion: v1
kind: Service
metadata:
  name: ipatlas-service
  labels:
    app: ipatlas
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: ipatlas
