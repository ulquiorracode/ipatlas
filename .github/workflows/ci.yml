name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy (Pedantic Warnings as Errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --all-targets

      - name: Verify Reader-Only Build (no-default-features)
        run: cargo check --no-default-features

      - name: Smoke Test Benchmark Harness
        run: cargo test --benches

      - name: Build C-ABI Shared Library (Release)
        run: cargo build --release -p ipatlas-adapter-c

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Sample Test Database Fixture
        run: |
          python -c "import tempfile, subprocess, os, sys; os.makedirs('dist', exist_ok=True); f1 = tempfile.NamedTemporaryFile('w', delete=False, suffix='.csv'); f1.write('16777216,16777471,US,United States,California,Los Angeles,34.05,-118.25\n134744064,134744319,US,United States,California,Mountain View,37.40,-122.07\n'); f1.close(); f2 = tempfile.NamedTemporaryFile('w', delete=False, suffix='.csv'); f2.write('16777216,16777471,DCH,CloudProvider\n'); f2.close(); r = subprocess.run(['cargo', 'run', '-p', 'ipatlas-cli', '--', 'compile', '--geo', f1.name, '--proxy', f2.name, '-o', 'dist/ipatlas_goldsrc_city.bin']); os.remove(f1.name); os.remove(f2.name); sys.exit(r.returncode)"

      - name: Run Python Bindings Tests
        run: |
          python -m unittest discover -s bindings/python/tests
        env:
          PYTHONPATH: bindings/python

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Go Bindings Tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cd bindings/go
          go test -v ./...
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release
          DYLD_LIBRARY_PATH: ${{ github.workspace }}/target/release

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Docs (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  audit:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit, cargo-deny

      - name: Run cargo audit
        run: cargo audit --ignore RUSTSEC-2026-0258

      - name: Run cargo deny (licenses, bans, sources)
        run: cargo deny check
