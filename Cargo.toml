[workspace]
members = [
    "core/ipatlas-core",
    "adapters/ipatlas-adapter-tower",
    "adapters/ipatlas-adapter-actix",
    "adapters/ipatlas-adapter-maxmind",
    "adapters/ipatlas-adapter-maxminddb-compat",
    "adapters/ipatlas-adapter-c",
    "cli/ipatlas-cli",
]
resolver = "2"

[workspace.package]
version = "0.13.1"
edition = "2021"
rust-version = "1.74"
authors = ["ulquiorracode"]
license = "MIT"
repository = "https://github.com/ulquiorracode/ipatlas"

[workspace.dependencies]
ipatlas-core = { path = "core/ipatlas-core", version = "0.13.1" }

memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
memchr = "2.7"
thiserror = "2.0"
stitch-rs = { git = "https://github.com/ulquiorracode/stitch-rs.git", tag = "v0.3.0", default-features = false }
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
zstd = "0.14.0"
arc-swap = "1.7"
tempfile = "3.17"
criterion = { version = "0.5", features = ["html_reports"] }
