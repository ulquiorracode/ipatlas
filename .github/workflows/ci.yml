name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --check

      - name: Run Clippy (Pedantic Warnings as Errors)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Unit & Integration Tests
        run: cargo test --all-targets

      - name: Verify Reader-Only Build (no-default-features)
        run: cargo check --no-default-features

      - name: Smoke Test Benchmark Harness
        run: cargo test --benches

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Docs (warnings as errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps --all-features

  audit:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit, cargo-deny

      - name: Run cargo audit
        run: cargo audit

      - name: Run cargo deny (licenses, bans, sources)
        run: cargo deny check
